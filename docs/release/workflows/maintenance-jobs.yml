# PROPOSAL — NOT ACTIVE. Kept under docs/ on purpose: GitHub only runs workflows from
# .github/workflows/ on the DEFAULT branch. Moving this file there is approval-gated
# (needs AST-002 default branch, a JOBS_DATABASE_URL secret, the production-jobs environment).
# See docs/release/SCHEDULER_AND_OPS.md.
name: Maintenance jobs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # expire_bookings every 15 min, off the top of the hour
    - cron: "41 3 * * *"           # purge_idempotency_keys daily 03:41 UTC (08:41 PKT)
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [expire_bookings, purge_idempotency_keys]
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: production-jobs          # holds JOBS_DATABASE_URL; Maaz = required reviewer for manual runs
    timeout-minutes: 10
    concurrency:
      group: maint-${{ github.event.schedule || inputs.job }}
      cancel-in-progress: false           # never kill a running sweep; the advisory lock handles overlap
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt   # same as ci.yml (pip reads the UTF-16 BOM)
      - name: Pick job
        id: pick
        run: |
          JOB="${{ inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "41 3 * * *" ]; then JOB=purge_idempotency_keys; else JOB=expire_bookings; fi
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
      - name: Run (retry once on failure)
        env:
          DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}   # rideshare_jobs role, DIRECT (non -pooler) host
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if python -m "jobs.${{ steps.pick.outputs.job }}" | tee out.txt; then exit 0; fi
            echo "attempt $attempt failed: $(tail -1 out.txt)"
            [ "$attempt" = 1 ] && sleep 60
          done
          exit 1                                   # red run -> GitHub failure e-mail to Maaz
      - name: Summary
        if: always()
        run: tail -1 out.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Heartbeat (dead-man switch)
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.JOBS_HEARTBEAT_URL }}
        run: '[ -z "$HEARTBEAT_URL" ] || curl -fsS -m 10 "$HEARTBEAT_URL" > /dev/null'
