name: CI

on:
  pull_request:
  push:
    branches: [main, rideshare-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Exceptions: .github/audit-exceptions.toml (each with a reason and a
    # review_by date; expired entries fail). Triage:
    # docs/security/DEPENDENCY_AUDIT_2026-10-31.md

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Audit Python requirements
        # Any unexcepted Python advisory fails: pip-audit data has no reliable
        # severity, so the threshold is "all" rather than high/critical.
        run: |
          python -m pip install "pip-audit==2.10.1"
          ignore_args="$(python .github/scripts/audit_gate.py pip-ignore-args)"
          python -m pip_audit --requirement requirements.txt --strict --desc on $ignore_args

      - name: Audit frontend dependencies (high and critical)
        working-directory: frontend
        run: |
          set +e
          npm audit --audit-level=high
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          set -e
          python ../.github/scripts/audit_gate.py npm-gate "$RUNNER_TEMP/npm-audit.json"

  test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:15
        env:
          # Ephemeral CI-only credentials; never use for a deployed database.
          # The image's bootstrap user can create the disposable migration DBs.
          POSTGRES_USER: rideshare_ci
          POSTGRES_PASSWORD: ci-only-disposable-postgres-password
          POSTGRES_DB: rideshare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideshare_ci -d rideshare_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://rideshare_ci:ci-only-disposable-postgres-password@localhost:5432/rideshare_ci
      TEST_DATABASE_URL: postgresql+asyncpg://rideshare_ci:ci-only-disposable-postgres-password@localhost:5432/rideshare_ci
      SECRET_KEY: ci-only-disposable-jwt-signing-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PYTHONDONTWRITEBYTECODE: "1"
      # Existing regression suite remains unthrottled; dedicated integration
      # tests explicitly enable the limiter against this disposable service.
      AUTH_RATE_LIMIT_ENABLED: "false"
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate CI configuration
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          import config  # Fail before tests can override invalid application settings.

          for name in ("DATABASE_URL", "TEST_DATABASE_URL"):
              value = os.environ.get(name)
              if not value or make_url(value).drivername != "postgresql+asyncpg":
                  raise RuntimeError(f"{name} must configure PostgreSQL with asyncpg")
          PY

      - name: Apply migrations to the empty CI database
        run: python -m alembic upgrade head

      - name: Run the complete test suite
        run: python -B -m unittest discover -s tests -v
