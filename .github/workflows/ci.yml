name: CI

on:
  pull_request:
  push:
    branches: [main, rideshare-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:15
        env:
          # Ephemeral CI-only credentials; never use for a deployed database.
          # The image's bootstrap user can create the disposable migration DBs.
          POSTGRES_USER: rideshare_ci
          POSTGRES_PASSWORD: ci-only-disposable-postgres-password
          POSTGRES_DB: rideshare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideshare_ci -d rideshare_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://rideshare_ci:ci-only-disposable-postgres-password@localhost:5432/rideshare_ci
      TEST_DATABASE_URL: postgresql+asyncpg://rideshare_ci:ci-only-disposable-postgres-password@localhost:5432/rideshare_ci
      SECRET_KEY: ci-only-disposable-jwt-signing-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PYTHONDONTWRITEBYTECODE: "1"
      # Existing regression suite remains unthrottled; dedicated integration
      # tests explicitly enable the limiter against this disposable service.
      AUTH_RATE_LIMIT_ENABLED: "false"
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate CI configuration
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          import config  # Fail before tests can override invalid application settings.

          for name in ("DATABASE_URL", "TEST_DATABASE_URL"):
              value = os.environ.get(name)
              if not value or make_url(value).drivername != "postgresql+asyncpg":
                  raise RuntimeError(f"{name} must configure PostgreSQL with asyncpg")
          PY

      - name: Apply migrations to the empty CI database
        run: python -m alembic upgrade head

      - name: Run the complete test suite
        run: python -B -m unittest discover -s tests -v

  frontend:
    name: Frontend typecheck, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js (pinned in frontend/.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright browser smoke (production bundle, disposable backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          # Ephemeral CI-only credentials; never use for a deployed database.
          POSTGRES_USER: rideshare_ci
          POSTGRES_PASSWORD: ci-only-disposable-postgres-password
          POSTGRES_DB: rideshare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideshare_ci -d rideshare_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://rideshare_ci:ci-only-disposable-postgres-password@localhost:5432/rideshare_ci
      SECRET_KEY: ci-only-disposable-jwt-signing-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PYTHONDONTWRITEBYTECODE: "1"
      AUTH_RATE_LIMIT_ENABLED: "false"
      # The browser only ever talks to this loopback server. Most specs mock the
      # API with Playwright routes; live-backend.spec.ts uses the real one.
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_API_ORIGIN: http://127.0.0.1:8000
      E2E_LIVE_BACKEND: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations to the empty CI database
        run: python -m alembic upgrade head

      - name: Set up Node.js (pinned in frontend/.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the production bundle
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the disposable backend serving frontend/dist
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/login; then exit 0; fi
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Run Playwright smoke and accessibility tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            uvicorn.log
          retention-days: 7
          if-no-files-found: ignore
